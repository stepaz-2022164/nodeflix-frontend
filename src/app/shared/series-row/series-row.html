<section class="space-y-3">
  <div class="flex items-center justify-between gap-4 px-5 sm:px-8">
    <h2 class="text-lg font-semibold tracking-normal text-white sm:text-xl">{{ title() }}</h2>
    <div class="h-px flex-1 bg-gradient-to-r from-white/20 to-transparent"></div>
    @if (items().length > 3) {
      <div class="flex gap-2">
        <button
          type="button"
          title="Mover a la izquierda"
          class="grid size-9 place-items-center rounded-md bg-white/10 text-white ring-1 ring-white/10 transition hover:bg-white hover:text-black"
          (click)="scroll('left')"
        >
          <svg lucideChevronLeft class="size-5"></svg>
        </button>
        <button
          type="button"
          title="Mover a la derecha"
          class="grid size-9 place-items-center rounded-md bg-white/10 text-white ring-1 ring-white/10 transition hover:bg-white hover:text-black"
          (click)="scroll('right')"
        >
          <svg lucideChevronRight class="size-5"></svg>
        </button>
      </div>
    }
  </div>

  @if (items().length) {
    <div #scroller class="scroll-row flex snap-x gap-4 overflow-x-auto px-5 pb-4 pt-1 sm:px-8">
      @for (serie of items(); track serie.id_tmdb) {
        <app-series-card 
          class="snap-start" 
          [serie]="serie" 
          (viewDetails)="viewDetails.emit($event)" 
        />
      }
    </div>
  } @else {
    <div class="px-5 text-sm text-neutral-400 sm:px-8">Sin resultados para esta seccion.</div>
  }
</section>
