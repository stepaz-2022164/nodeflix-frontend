<article
  class="group relative w-40 shrink-0 overflow-visible sm:w-48 cursor-pointer"
  (click)="onCardClick()"
>
  <div class="poster-shadow relative aspect-[2/3] overflow-hidden rounded-md bg-neutral-900 ring-1 ring-white/10">
    @if (posterUrl(); as poster) {
      <img
        class="h-full w-full object-cover transition duration-300 group-hover:scale-105"
        [src]="poster"
        [alt]="serie().titulo"
        loading="lazy"
      />
    } @else {
      <div class="flex h-full w-full items-center justify-center bg-neutral-900 px-4 text-center text-sm text-neutral-400">
        {{ serie().titulo }}
      </div>
    }

    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/45 to-transparent opacity-75"></div>

    <div class="absolute inset-x-0 bottom-0 p-3">
      <div class="flex items-center gap-1 text-xs text-white/80">
        @if (rating()) {
          <span class="rounded-sm bg-emerald-400 px-1.5 py-0.5 font-semibold text-black">{{ rating() }}</span>
        } @else if (serie().score) {
          <span class="rounded-sm bg-red-500 px-1.5 py-0.5 font-semibold text-white">{{ serie().score }}</span>
        }
        @if (genres()) {
          <span class="truncate">{{ genres() }}</span>
        }
      </div>
      <h3 class="mt-1 line-clamp-2 text-sm font-semibold leading-tight text-white">{{ serie().titulo }}</h3>
    </div>

    <div class="absolute inset-0 bg-black/20 opacity-0 transition duration-300 group-hover:opacity-100 flex items-center justify-center">
        <div class="grid size-12 place-items-center rounded-full bg-black/60 text-white ring-1 ring-white/20 backdrop-blur-sm transform scale-90 group-hover:scale-100 transition duration-300">
          <svg lucideCirclePlay class="size-6"></svg>
        </div>
    </div>
  </div>
</article>
